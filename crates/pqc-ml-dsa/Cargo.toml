[package]
description = "FIPS 204 ML-DSA implementation for PQC-rs"
name = "pqc-rs-ml-dsa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/pqc-rs-ml-dsa"
categories = ["cryptography"]
keywords = ["post-quantum", "cryptography", "ml-dsa", "signatures", "rust"]

# Publication remains disabled until the complete ML-DSA release-candidate
# evidence and publication gates have passed.
publish = false

[features]
default = []
acvp = ["pqc-core/acvp"]
bench = ["pqc-core/bench"]

[dependencies]
pqc-core = { workspace = true }
rand_core = { workspace = true }
sha3 = { workspace = true }
sha2 = { workspace = true }

[lib]
name = "pqc_ml_dsa"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "ml_dsa"
harness = false
