[package]
description = "FIPS 204 ML-DSA implementation for PQC-rs"
name = "pqc-rs-ml-dsa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["std"]
std = ["pqc-core/std"]
alloc = ["pqc-core/alloc"]
acvp = ["pqc-core/acvp"]
bench = ["pqc-core/bench"]

[dependencies]
pqc-core = { workspace = true }
rand_core = { workspace = true }
sha3 = { workspace = true }
sha2 = { workspace = true }

[lib]
name = "pqc_ml_dsa"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "ml_dsa"
harness = false
