[package]
description = "FIPS 204 ML-DSA implementation for PQC-rs"
name = "pqc-rs-ml-dsa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/pqc-rs-ml-dsa"
categories = ["cryptography"]
keywords = ["post-quantum", "cryptography", "ml-dsa", "signatures", "rust"]

# Publication is enabled and remains subject to the repository release policy.
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-D", "warnings"]

[features]
default = []
acvp = ["pqc-core/acvp"]
bench = ["pqc-core/bench"]
internal-api = []

[dependencies]
pqc-core = { workspace = true }
rand_core = { workspace = true }
sha3 = { workspace = true }
sha2 = { workspace = true }

[lib]
name = "pqc_ml_dsa"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "ml_dsa"
harness = false
required-features = ["internal-api"]
