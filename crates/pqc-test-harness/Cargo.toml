[package]
name = "pqc-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["pqc-core/std", "pqc-ml-kem/std"]
alloc = ["pqc-core/alloc", "pqc-ml-kem/alloc"]
acvp = ["pqc-core/acvp"]
bench = ["pqc-core/bench"]

[dependencies]
pqc-core = { workspace = true, features = ["std"] }
pqc-ml-kem = { path = "../pqc-ml-kem", version = "0.4.0", features = ["std"] }
rand_core = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
