[package]
name = "pqc-rs-ml-kem"
version = "1.0.0-rc.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Standards-focused Rust implementation of ML-KEM for PQC-rs."
readme = "../../README.md"
categories = ["cryptography"]
keywords = ["post-quantum", "cryptography", "ml-kem", "kem", "rust"]

[features]
default = ["std"]
std = ["pqc-core/std", "sha3/std"]
alloc = ["pqc-core/alloc"]
acvp = ["pqc-core/acvp"]
bench = ["pqc-core/bench"]
internal-api = []

[dependencies]
pqc-core = { workspace = true }
rand_core = { workspace = true }
sha3 = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
chacha20poly1305 = { workspace = true }
criterion = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }

[[bench]]
name = "ml_kem"
harness = false

[lib]
name = "pqc_ml_kem"

[[example]]
name = "p3_4e_production_matrix_profile"
required-features = ["internal-api"]
