[package]
name = "pqc-rs-ml-kem"
version = "0.4.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Standards-focused Rust implementation of ML-KEM for PQC-rs."
readme = "../../README.md"
categories = ["cryptography"]
keywords = ["post-quantum", "cryptography", "ml-kem", "kem", "rust"]

[features]
default = ["std"]
std = ["pqc-core/std", "sha3/std"]
alloc = ["pqc-core/alloc"]
acvp = ["pqc-core/acvp"]
bench = ["pqc-core/bench"]

[dependencies]
pqc-core = { workspace = true }
rand_core = { workspace = true }
sha3 = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "ml_kem"
harness = false

[lib]
name = "pqc_ml_kem"
