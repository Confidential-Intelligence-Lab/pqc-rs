[package]
name = "pqc-rs-protocol"
version = "0.4.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Protocol-layer types and wire-format foundations for PQC-rs."
readme = "README.md"
categories = ["cryptography", "network-programming"]
keywords = ["post-quantum", "cryptography", "protocol", "pqc", "rust"]

[features]
default = ["std"]
std = ["pqc-core/std"]
alloc = ["pqc-core/alloc"]

[dependencies]
pqc-core = { workspace = true }

[lib]
name = "pqc_protocol"
