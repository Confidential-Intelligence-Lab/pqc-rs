[interop]
schema_version = 1
project = "pqc-rfc9958-rs"
protocol_version = 1
default_timeout_seconds = 30
output = "target/interop"

[[provider]]
id = "selftest"
title = "Interoperability protocol self-test"
enabled = true
command = ["python3", "scripts/interop/providers/selftest_provider.py"]
required = true

[[provider]]
id = "rust"
title = "pqc-rfc9958-rs native provider"
enabled = false
command = ["python3", "scripts/interop/providers/rust_provider.py"]
required = false
notes = "A2.3 native Rust provider; used by cargo xtask interop-cross."

[[provider]]
id = "liboqs"
title = "Open Quantum Safe liboqs"
enabled = true
command = ["python3", "scripts/interop/providers/liboqs_provider.py"]
required = false
notes = "Native liboqs provider covering ML-KEM-512/768/1024 and ML-DSA-44/65/87. ML-KEM supports deterministic parity; ML-DSA participates in semantic/raw-object interoperability because liboqs does not expose deterministic ML-DSA keygen or explicit signing randomness through its public API."

[[provider]]
id = "wolfssl"
title = "wolfSSL native wolfCrypt"
enabled = false
command = ["python3", "scripts/interop/providers/wolfssl_provider.py"]
required = false
notes = "Native wolfCrypt provider covering ML-KEM-512/768/1024 and ML-DSA-44/65/87 through the common primitive interoperability contract."

[[provider]]
id = "openssl"
title = "OpenSSL 3.5+ default provider"
enabled = false
command = ["python3", "scripts/interop/providers/openssl_provider.py"]
required = false
notes = "Native OpenSSL provider covering ML-KEM-512/768/1024 and ML-DSA-44/65/87 through the common primitive interoperability contract."

[[provider]]
id = "botan"
title = "Botan"
enabled = false
command = ["python3", "scripts/interop/providers/botan_provider.py"]
required = false
notes = "Adapter reserved for A2.3; enable only after Botan and the adapter are installed."

[[suite]]
id = "framework-protocol"
title = "Provider protocol and normalization conformance"
vectors = ["interop/vectors/framework/*.json"]
providers = ["selftest"]
required = true

[[suite]]
id = "liboqs-smoke"
title = "liboqs ML-KEM and ML-DSA adapter smoke interoperability"
vectors = ["interop/vectors/liboqs/*.json"]
providers = ["liboqs"]
required = false
comparison = "semantic"


[[suite]]
id = "software-provider-parity"
title = "Canonical software-provider interoperability parity gate"
vectors = []
providers = ["rust", "wolfssl", "openssl", "liboqs"]
required = false
comparison = "provider-parity"
notes = "Executed by cargo xtask interop-cross --strict. Covers exact ML-KEM parity across all four providers, exact ML-DSA parity where deterministic APIs are public, and semantic/negative ML-DSA interoperability across all four providers."
