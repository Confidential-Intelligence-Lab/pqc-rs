name: Secret hygiene

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "13 9 * * 5"

permissions:
  contents: read

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/run-stage8d.sh
      - name: Upload review inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8d-review-inventories
          path: |
            target/stage8d-secret-inventory.txt
            target/stage8d-secret-branch-inventory.txt
            target/stage8d-debug-findings.txt
            target/stage8d-unsafe-inventory.txt
