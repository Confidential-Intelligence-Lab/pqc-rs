name: Secret hygiene

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "13 9 * * 5"

permissions:
  contents: read

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: ./scripts/run-stage8d.sh
      - name: Upload review inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage8d-review-inventories
          path: |
            target/stage8d-secret-inventory.txt
            target/stage8d-secret-branch-inventory.txt
            target/stage8d-debug-findings.txt
            target/stage8d-unsafe-inventory.txt
