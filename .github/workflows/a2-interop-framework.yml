name: A2 Interoperability Framework

on:
  push:
    paths:
      - "interop/**"
      - "scripts/interop_engine.py"
      - "scripts/interop/**"
      - "xtask/**"
      - ".github/workflows/a2-interop-framework.yml"
  pull_request:
    paths:
      - "interop/**"
      - "scripts/interop_engine.py"
      - "scripts/interop/**"
      - "xtask/**"

jobs:
  protocol-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install A2.1 xtask command
        run: python3 scripts/install-a2-1.py
      - name: Validate framework
        run: python3 scripts/validate-a2-1.py
      - name: Run through xtask
        run: cargo xtask interop --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: interoperability-report
          path: target/interop/
