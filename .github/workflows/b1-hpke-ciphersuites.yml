name: B1 HPKE ciphersuites

on:
  push:
    paths:
      - "crates/pqc-hpke/**"
      - "scripts/validate-b1-2.py"
      - "README-b1-2.md"
      - ".github/workflows/b1-hpke-ciphersuites.yml"
  pull_request:
    paths:
      - "crates/pqc-hpke/**"
      - "scripts/validate-b1-2.py"
      - "README-b1-2.md"
      - ".github/workflows/b1-hpke-ciphersuites.yml"

jobs:
  hpke-ciphersuite-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate milestone structure
        run: python3 scripts/validate-b1-2.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -p pqc-rs-hpke --all-targets --all-features -- -D warnings
      - name: Run HPKE tests
        run: cargo test -p pqc-rs-hpke --all-targets --all-features
