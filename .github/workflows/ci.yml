name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --exclude pqc-rs-haetae

      - name: HAETAE public API build
        run: cargo check --locked -p pqc-rs-haetae

      - name: HAETAE internal assurance API build
        run: cargo check --locked -p pqc-rs-haetae --features internal-api

      - name: HAETAE portable tests
        run: bash scripts/run-haetae-portable-tests.sh

      - name: HAETAE authenticated C-reference NTT parity
        run: |
          cargo test --locked             -p pqc-rs-haetae             --features internal-api             --test ntt_extended

      - name: SMAUG-T formatting
        run: cargo fmt --manifest-path experimental/pqc-rs-smaug-t/Cargo.toml --check

      - name: SMAUG-T strict Clippy
        run: cargo clippy --manifest-path experimental/pqc-rs-smaug-t/Cargo.toml --all-targets -- -D warnings

      - name: SMAUG-T tests
        run: |
          cargo test --manifest-path experimental/pqc-rs-smaug-t/Cargo.toml --lib
          cargo test --manifest-path experimental/pqc-rs-smaug-t/Cargo.toml --test indcpa_decrypt_roundtrip

      - name: SMAUG-T documentation tests
        run: cargo test --manifest-path experimental/pqc-rs-smaug-t/Cargo.toml --doc
