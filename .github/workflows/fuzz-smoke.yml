name: Fuzz smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 10 * * 3"

permissions:
  contents: read

jobs:
  fuzz-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate fuzz policy and generated documentation
        run: cargo xtask fuzz-audit --check

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-fuzz
      - name: Run bounded fuzz targets
        env:
          FUZZ_SECONDS: "30"
        run: ./scripts/run-fuzz-smoke.sh
