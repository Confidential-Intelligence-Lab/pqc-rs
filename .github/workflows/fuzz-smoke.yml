name: Fuzz smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 10 * * 3"

permissions:
  contents: read

jobs:
  fuzz-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Validate fuzz policy and generated documentation
        run: cargo xtask fuzz-audit --check

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo install --locked cargo-fuzz
      - name: Run bounded fuzz targets
        env:
          FUZZ_SECONDS: "30"
        run: ./scripts/run-fuzz-smoke.sh
