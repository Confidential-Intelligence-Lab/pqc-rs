name: Constant-time audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  constant-time-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Check generated constant-time audit
        run: cargo xtask constant-time-audit --check
      - name: Check related security policy gates
        run: |
          cargo xtask zeroization-audit --check
          cargo xtask api-review --check
