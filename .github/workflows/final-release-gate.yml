name: Final release gate
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
jobs:
  final-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo xtask validation-certification --check
      - run: cargo xtask security-certification --check
      - run: cargo xtask standards-certification --check
      - run: cargo xtask architecture-snapshot --check
      - run: cargo xtask release-manifest --check
      - run: cargo xtask release-audit
      - run: cargo xtask release-audit --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-certification-package
          path: |
            RELEASE_MANIFEST.md
            docs/release/
            docs/security/SECURITY_CERTIFICATION.md
            docs/architecture/ARCHITECTURE.md
            target/release-audit.json
