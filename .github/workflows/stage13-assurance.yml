name: Stage 13 Assurance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Assurance profile
        required: true
        default: portable
        type: choice
        options: [portable, review]
permissions:
  contents: read
jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Validate overlay
        run: python3 scripts/validate-stage13.py
      - name: Run assurance profile
        run: ./scripts/run-stage13.sh "${{ inputs.profile || 'portable' }}"
      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13-assurance-${{ github.sha }}
          path: |
            target/stage13/
            target/stage13-*-evidence.tar.gz
          if-no-files-found: warn
          retention-days: 30
