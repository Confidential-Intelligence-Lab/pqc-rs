name: HAETAE experimental

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-haetae:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Default public API build
        run: cargo check --locked -p pqc-rs-haetae

      - name: Internal assurance API build
        run: cargo check --locked -p pqc-rs-haetae --features internal-api

      - name: Strict Clippy
        run: cargo clippy --locked -p pqc-rs-haetae --all-targets --features internal-api -- -D warnings

      - name: Portable HAETAE runtime tests
        run: bash scripts/run-haetae-portable-tests.sh

      - name: Compile four fuzz targets
        run: cargo check --locked --manifest-path crates/pqc-haetae/fuzz/Cargo.toml --bins

      - name: API inventory
        run: cargo xtask api-review --check

      - name: Zeroization inventory
        run: cargo xtask zeroization-audit --check

      - name: Constant-time inventory
        run: cargo xtask constant-time-audit --check
