name: A2.4 OpenSSL provider interoperability
on:
  push:
  pull_request:
jobs:
  rust-openssl:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install OpenSSL 3.5 development package
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
          openssl version -a
          dpkg --compare-versions "$(openssl version | awk '{print $2}')" ge 3.5.0
      - name: Quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: OpenSSL provider interoperability
        run: |
          python3 scripts/validate-a2-4.py
          cargo xtask interop-openssl --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a2-4-openssl-interop-report
          path: target/interop-openssl/
