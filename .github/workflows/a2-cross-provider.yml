name: A2.3 cross-provider interoperability
on:
  push:
  pull_request:
jobs:
  rust-liboqs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Build liboqs 0.16.0
        run: |
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -GNinja -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON
          cmake --build /tmp/liboqs/build
          sudo cmake --install /tmp/liboqs/build --prefix /usr/local
      - name: Quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Cross-provider interoperability
        env:
          OQS_PREFIX: /usr/local
          LD_LIBRARY_PATH: /usr/local/lib
        run: cargo xtask interop-cross --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a2-3-interop-report
          path: target/interop-cross/
