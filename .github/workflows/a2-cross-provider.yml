name: Software provider interoperability

on:
  push:
    paths:
      - "crates/**"
      - "interop/**"
      - "scripts/cross_provider_interop.py"
      - "scripts/interop/**"
      - "xtask/**"
      - "docs/interoperability/**"
      - ".github/workflows/a2-cross-provider.yml"
  pull_request:
    paths:
      - "crates/**"
      - "interop/**"
      - "scripts/cross_provider_interop.py"
      - "scripts/interop/**"
      - "xtask/**"
      - "docs/interoperability/**"
      - ".github/workflows/a2-cross-provider.yml"

jobs:
  provider-parity:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev

          openssl version -a
          dpkg --compare-versions \
            "$(openssl version | awk '{print $2}')" \
            ge 3.5.0

      - name: Build liboqs 0.16.0
        run: |
          git clone \
            --depth 1 \
            --branch 0.16.0 \
            https://github.com/open-quantum-safe/liboqs.git \
            "$RUNNER_TEMP/liboqs"

          cmake \
            -S "$RUNNER_TEMP/liboqs" \
            -B "$RUNNER_TEMP/liboqs/build" \
            -GNinja \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/oqs-install" \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="KEM_ml_kem_512;KEM_ml_kem_768;KEM_ml_kem_1024;SIG_ml_dsa_44;SIG_ml_dsa_65;SIG_ml_dsa_87"

          cmake --build "$RUNNER_TEMP/liboqs/build"
          cmake --install "$RUNNER_TEMP/liboqs/build"

      - name: Build wolfSSL 5.9.2
        run: |
          git clone \
            --depth 1 \
            --branch v5.9.2-stable \
            https://github.com/wolfSSL/wolfssl.git \
            "$RUNNER_TEMP/wolfssl"

          cd "$RUNNER_TEMP/wolfssl"

          autoreconf -fi

          ./configure \
            --prefix="$RUNNER_TEMP/wolfssl-install" \
            --enable-mlkem \
            --enable-mldsa \
            --disable-shared \
            --enable-static

          make -j2
          make install

      - name: Quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Four-provider parity
        env:
          OQS_PREFIX: ${{ runner.temp }}/oqs-install
          WOLFSSL_PREFIX: ${{ runner.temp }}/wolfssl-install
          LD_LIBRARY_PATH: ${{ runner.temp }}/oqs-install/lib
        run: |
          cargo xtask interop-cross --strict

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: software-provider-parity-report
          path: target/interop-cross/
