name: Benchmark smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo xtask performance-audit --check
      - run: cargo bench --bench ml_kem -- --test
      - run: cargo bench --bench ml_dsa -- --test
      - run: cargo bench --bench hpke -- --test
      - run: cargo bench --bench hybrid_hpke -- --test
