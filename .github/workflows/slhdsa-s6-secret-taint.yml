name: SLH-DSA S6 Secret Taint

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/pqc-slh-dsa/**"
      - "crates/pqc-test-harness/**"
      - "scripts/run-slhdsa-s6-secret-taint.sh"
      - ".github/workflows/slhdsa-s6-secret-taint.yml"

jobs:
  secret-taint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run SLH-DSA secret-taint audit
        run: ./scripts/run-slhdsa-s6-secret-taint.sh

      - name: Upload secret-taint artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slhdsa-s6-secret-taint
          path: target/slhdsa-s6-secret-taint
