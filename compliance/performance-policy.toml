[metadata]
schema_version = 1
project = "pqc-rfc9958-rs"
review_boundary = "B1.3.5"
claim = "reproducible engineering baseline; not a cross-platform performance guarantee"
allowed_statuses = ["active", "planned", "retired"]
allowed_classes = ["key-generation", "encapsulation", "decapsulation", "signing", "verification", "protocol-setup", "authenticated-encryption", "exporter"]
regression_review_percent = 10
regression_block_percent = 20
minimum_sample_size = 10

[[benchmark]]
id = "PERF-MLKEM-KEYGEN"
name = "ml_kem/keygen"
crate = "pqc-rs-ml-kem"
bench = "ml_kem"
class = "key-generation"
status = "active"
parameter_sets = ["ML-KEM-512", "ML-KEM-768", "ML-KEM-1024"]
metrics = ["median latency", "confidence interval", "throughput"]
source = "crates/pqc-ml-kem/benches/ml_kem.rs"

