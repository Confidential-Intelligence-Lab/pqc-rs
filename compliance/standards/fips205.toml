schema_version = 2
standard = "FIPS205"
title = "Stateless Hash-Based Digital Signature Standard"
classification = "normative"
source = "https://doi.org/10.6028/NIST.FIPS.205"
published = "2024-08-13"
notes = [
  "This module records repository traceability to FIPS 205; it does not constitute CAVP, CMVP, FIPS 140-3 validation, certification, or an independent security audit.",
  "Statuses are intentionally conservative. A requirement is marked mapped when implementation and repository tests can be identified; external validation and interoperability are tracked separately.",
  "The current public API implements Pure SLH-DSA. HashSLH-DSA external signing and verification are explicit completion gaps at the S1 audit baseline.",
  "S1 audit baseline commit: 80ba9265a8bdf9a884283afd22465a79c1858569."
]

