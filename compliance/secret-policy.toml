[metadata]
schema_version = 1
milestone = "B1.3.2"
review_scope = "owned public and protocol-level secret containers"

[[secret]]
id = "core-secret-key-bytes"
type = "pqc_core::SecretKeyBytes<N>"
source = "crates/pqc-core/src/bytes.rs"
representation = "fixed-array"
zeroization = "ZeroizeOnDrop"
clone_policy = "allowed-compatibility"
copy_policy = "forbidden"
debug_policy = "redacted"
exposure_policy = "borrow-and-explicit-encode"
rationale = "Public compatibility type. Clone and encoding create additional caller-managed secret copies."

[[secret]]
id = "core-shared-secret-bytes"
type = "pqc_core::SharedSecretBytes<N>"
source = "crates/pqc-core/src/bytes.rs"
representation = "fixed-array"
zeroization = "ZeroizeOnDrop"
clone_policy = "allowed-compatibility"
copy_policy = "forbidden"
debug_policy = "redacted"
exposure_policy = "borrow-and-explicit-encode"
rationale = "Shared-secret compatibility type with constant-time equality."

[[secret]]
id = "core-secret-bytes"
type = "pqc_core::secret::SecretBytes<N>"
source = "crates/pqc-core/src/secret.rs"
representation = "fixed-array-private-field"
zeroization = "ZeroizeOnDrop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "borrow-or-explicit-copy"
rationale = "Preferred fixed-size secret wrapper for new APIs."

[[secret]]
id = "core-secret-vec"
type = "pqc_core::secret::SecretVec"
source = "crates/pqc-core/src/secret.rs"
representation = "heap-private-field"
zeroization = "ZeroizeOnDrop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "borrow-only"
rationale = "Preferred variable-size owned secret wrapper."

[[secret]]
id = "ct-secret-bytes"
type = "pqc_core::ct::SecretBytes<N>"
source = "crates/pqc-core/src/ct/container.rs"
representation = "fixed-array-private-field"
zeroization = "explicit-Drop"
clone_policy = "allowed-reviewed"
copy_policy = "forbidden"
debug_policy = "redacted"
exposure_policy = "borrow-or-explicit-copy"
rationale = "Clone is retained for constant-time algorithm construction and is documented as creating an additional secret lifetime."

[[secret]]
id = "ml-dsa-internal-generated-key-pair"
type = "pqc_ml_dsa::keygen::MlDsaKeyPair"
source = "crates/pqc-ml-dsa/src/keygen.rs"
representation = "Vec-public-and-SecretVec-private-fields"
zeroization = "private-field-ZeroizeOnDrop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "borrow-or-consuming-split"
rationale = "Deterministic key generation moves the expanded private-key encoding directly into SecretVec before returning it; into_parts transfers the zeroizing owner without recreating a raw secret Vec."

[[secret]]
id = "ml-dsa-keygen-seed"
type = "pqc_ml_dsa::MlDsaKeyGenSeed"
source = "crates/pqc-ml-dsa/src/api.rs"
representation = "SecretBytes-field"
zeroization = "field-ZeroizeOnDrop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "explicit-borrow"
rationale = "The compact parameter-bound seed exposes only a byte borrow; expansion creates a separately owned expanded-key lifetime without consuming the seed."

[[secret]]
id = "ml-dsa-private-key"
type = "pqc_ml_dsa::MlDsaPrivateKey"
source = "crates/pqc-ml-dsa/src/api.rs"
representation = "SecretVec-field"
zeroization = "field-ZeroizeOnDrop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "explicit-borrow"
rationale = "The expanded signing-key encoding remains in zeroizing ownership; the public API exposes only a byte borrow."

[[secret]]
id = "ml-dsa-key-pair"
type = "pqc_ml_dsa::MlDsaKeyPair"
source = "crates/pqc-ml-dsa/src/api.rs"
representation = "owned-public-and-private-fields"
zeroization = "private-field-drop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "borrow-or-consuming-split"
rationale = "Accessors borrow both typed keys; into_parts transfers the existing private-key owner without creating a raw secret copy."

[[secret]]
id = "hpke-context-secrets"
type = "pqc_hpke::HpkeContext secret fields"
source = "crates/pqc-hpke/src/context.rs"
representation = "SecretVec-fields"
zeroization = "field-drop-and-explicit-context-drop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "exporter-api-only"
rationale = "AEAD key, exporter secret, and key-schedule secret remain owned by the context."

[[secret]]
id = "hpke-mlkem-private-key"
