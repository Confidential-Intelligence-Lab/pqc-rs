zeroization = "ZeroizeOnDrop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "internal-borrow"
rationale = "Seed, expanded private key, and shared secret use preferred wrappers."

[[secret]]
id = "hpke-hybrid-private-key"
type = "pqc_hpke::hybrid_kem private-key material"
source = "crates/pqc-hpke/src/hybrid_kem.rs"
representation = "SecretBytes-and-SecretVec"
zeroization = "ZeroizeOnDrop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "internal-borrow"
