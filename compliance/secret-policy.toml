clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "borrow-only"
rationale = "Preferred variable-size owned secret wrapper."

[[secret]]
id = "ct-secret-bytes"
type = "pqc_core::ct::SecretBytes<N>"
source = "crates/pqc-core/src/ct/container.rs"
representation = "fixed-array-private-field"
