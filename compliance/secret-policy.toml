[metadata]
schema_version = 1
milestone = "B1.3.2"
review_scope = "owned public and protocol-level secret containers"

[[secret]]
id = "core-secret-key-bytes"
type = "pqc_core::SecretKeyBytes<N>"
source = "crates/pqc-core/src/bytes.rs"
representation = "fixed-array"
zeroization = "ZeroizeOnDrop"
clone_policy = "allowed-compatibility"
copy_policy = "forbidden"
debug_policy = "redacted"
exposure_policy = "borrow-and-explicit-encode"
rationale = "Public compatibility type. Clone and encoding create additional caller-managed secret copies."

[[secret]]
id = "core-shared-secret-bytes"
type = "pqc_core::SharedSecretBytes<N>"
source = "crates/pqc-core/src/bytes.rs"
representation = "fixed-array"
zeroization = "ZeroizeOnDrop"
clone_policy = "allowed-compatibility"
copy_policy = "forbidden"
debug_policy = "redacted"
exposure_policy = "borrow-and-explicit-encode"
rationale = "Shared-secret compatibility type with constant-time equality."

[[secret]]
id = "core-secret-bytes"
type = "pqc_core::secret::SecretBytes<N>"
source = "crates/pqc-core/src/secret.rs"
representation = "fixed-array-private-field"
zeroization = "ZeroizeOnDrop"
clone_policy = "forbidden"
copy_policy = "forbidden"
debug_policy = "forbidden"
exposure_policy = "borrow-or-explicit-copy"
rationale = "Preferred fixed-size secret wrapper for new APIs."

[[secret]]
id = "core-secret-vec"
type = "pqc_core::secret::SecretVec"
