[workspace]
resolver = "2"
members = [
    "crates/pqc-core",
    "crates/pqc-ml-kem",
    "crates/pqc-ml-dsa",
    "crates/pqc-slh-dsa",
    "crates/pqc-hybrid",
    "crates/pqc-hpke",
    "crates/pqc-test-harness",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.oit.uci.edu/rcammaro/pqc-rfc9958-rs"
rust-version = "1.80"
authors = ["Rosario Cammarota"]
version = "0.4.0-rc.1"
homepage = "https://github.oit.uci.edu/rcammaro/pqc-rfc9958-rs"

[workspace.dependencies]
pqc-core = { path = "crates/pqc-core", version = "0.4.0-rc.1", default-features = false }

rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }
subtle = { version = "2", default-features = false }
sha3 = { version = "0.10", default-features = false }
thiserror = "1"
hex = "0.4"
criterion = "0.5"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hkdf = "0.12"
sha2 = "0.10"
pqc-ml-kem = { path = "crates/pqc-ml-kem", version = "0.4.0-rc.1" }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdh"] }
p384 = { version = "0.13", features = ["ecdh"] }
